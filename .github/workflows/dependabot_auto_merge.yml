name: Dependabot automerge

on: pull_request

# Dependabot-triggered runs cannot read Actions secrets and get a read-only
# GITHUB_TOKEN by default; elevating it here is what makes this work without a
# personal access token.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Dependabot opens many PRs at the same time. When a different merge
      # changes master first, GitHub refuses this one with "Base branch was
      # modified", so try again after a short wait.
      - name: Merge
        run: |
          for attempt in 1 2 3 4 5; do
            gh pr merge --merge "$PR_URL" && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      # A merge made with GITHUB_TOKEN does not start the push workflow. A
      # workflow_dispatch event is the exception, so start the build that way.
      # Then a dependency fix ships at once, not with the next yt-dlp release.
      - name: Build the image
        run: gh workflow run on_master.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
