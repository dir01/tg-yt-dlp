name: Create and publish a Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build. Empty means the default checkout for the event."
        type: string
        required: false
        default: ""
  # Manual runs so the build can be exercised without waiting for a push or the
  # nightly schedule.
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build. Empty means the default checkout for the event."
        type: string
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Each platform builds on a native runner. Before, arm64 ran under QEMU on an
  # amd64 runner, and the emulated uv sync took most of the build time.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve build metadata
        id: build
        run: |
          echo "timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN + packages:write is enough for GHCR. The previous PAT
          # expired silently and took the whole release pipeline down with it.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract labels for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Pushes the image without a tag. The merge job below puts the tags on
      # the multi-platform manifest.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_TIMESTAMP=${{ steps.build.outputs.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # The old actions/cache + type=local pair never refreshed: the key was
          # static, and actions/cache will not overwrite an existing key. type=gha
          # is managed by the cache service and updates in place. One scope for
          # each platform, so the two builds do not overwrite each other.
          cache-from: type=gha,scope=${{ steps.build.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.build.outputs.arch }}

      - name: Save digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.build.outputs.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Tags must come from what was actually checked out, not github.sha: on a
      # schedule-triggered release the bump commit is newer than the event SHA.
      - name: Resolve build metadata
        id: build
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # argocd-image-updater only accepts tags matching ^sha-.* (see
          # imageupdater-tg-yt-dlp.yaml in personal-cluster-state).
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.build.outputs.sha }}

      - name: Create and push the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY/$IMAGE_NAME@sha256:%s " *)
