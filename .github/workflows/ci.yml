# Dependabot PRs auto-merge, so whatever runs here is the only thing standing
# between a dependency bump and the image that ships a few hours later.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv stopped publishing moving major tags after v8.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Smoke test
        run: uv run --frozen python .github/smoke_test.py

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # amd64 only: this is a "does it still build" gate, and the emulated arm64
      # pass costs several minutes for no extra signal. The release build does both.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
