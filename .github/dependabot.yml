version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    ignore:
      # Owned by release.yml, which bumps it daily, smoke-tests it, and builds
      # an image directly. Leaving it here too would just create duplicate PRs.
      - dependency-name: "yt-dlp"
    # One PR per batch instead of one per package: they all ride the same daily
    # image build anyway, so splitting them only multiplies merges.
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # A Python minor bump must change .python-version and requires-python
      # too, and it needs musl wheels for every compiled dependency. Do it by
      # hand. Patch releases are safe and stay automatic.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
