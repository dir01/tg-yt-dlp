name: Dependabot automerge

on: pull_request

# Dependabot-triggered runs cannot read Actions secrets and get a read-only
# GITHUB_TOKEN by default; elevating it here is what makes this work without a
# personal access token.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
