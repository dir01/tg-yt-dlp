name: On push to master

on:
  push:
    branches: [master]
  workflow_dispatch:

# Many Dependabot merges can start this workflow at the same time. Run one
# build at a time. A build that waits is replaced by a newer one, and each
# build uses the newest master, so the last build always has all changes.
concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  image:
    name: Create and publish a Docker image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/do_build_image.yml
