[project]
name = "tg-yt-dlp"
version = "0.1.0"
description = "Telegram bot that wraps yt-dlp"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "python-telegram-bot>=22.8",
    # "default" adds yt-dlp-ejs, the scripts that solve the YouTube JavaScript
    # challenges with deno. yt-dlp pins its exact version.
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
