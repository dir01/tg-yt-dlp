version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    ignore:
      # Owned by release.yml, which bumps it daily, smoke-tests it, and builds
      # an image directly. Leaving it here too would just create duplicate PRs.
      - dependency-name: "yt-dlp"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "monthly"
